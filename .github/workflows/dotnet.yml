name: .NET

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nordly_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nordly_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Nordly.sln

      - name: Build solution
        run: dotnet build Nordly.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Nordly.sln --configuration Release --no-build --verbosity normal
        env:
          NORDLY_TEST_MIGRATION_CONNECTION: Host=localhost;Port=5432;Database=nordly_test;Username=postgres;Password=postgres

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nordly:ci .
