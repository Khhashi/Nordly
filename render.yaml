services:
  - type: web
    name: nordly
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Stripe__SecretKey
        sync: false
      - key: Stripe__WebhookSecret
        sync: false
      - key: Email__BrevoApiKey
        sync: false
      - key: Email__FromAddress
        sync: false
      - key: Email__FromName
        sync: false
